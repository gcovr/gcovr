
[build-system]
requires = [
    "hatchling==1.27.0",
    "hatch-vcs==0.5.0",
    "hatch-fancy-pypi-readme==25.1.0",
]
build-backend = "hatchling.build"

[project]
dynamic = ["version", "readme"]
name = "gcovr"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Lukas Atkinson", email = "opensource@lukasatkinson.de" },
    { name = "Michael Förderer", email = "michael.foerderer@gmx.de" },  # cspell:ignore Förderer
]
description = "Generate C/C++ code coverage reports with gcov"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
keywords = ["gcc", "gcov", "coverage", "lcov", "Cobertura", "Jenkins"]
dependencies = [
    "jinja2",
    "lxml",
    "colorlog",
    "pygments>=2.13.0",
    "tomli>=1.1.0 ; python_version < '3.11'",
    "typing_extensions ; python_version < '3.11'",  # Need to be installed manually
]

[project.optional-dependencies]
dev = [
    "bandit[toml]",
    "build",
    "cmake",
    "coverage",
    "mypy",
    "nox",
    "pre-commit",
    "pygments==2.21.0",     # For reference compare
    "pyinstaller~=6.16.0",
    "pylint<4.0.0",
    "pytest",
    "pytest-check",
    "pytest-cov",
    "pytest-timeout",
    "pytest-env",
    "pytest-xdist",
    "pywin32 ; sys_platform == 'win32'",
    "requests",
    "ruff~=0.16.7",
    "tomli >= 1.1.0 ; python_version < '3.11'",
    "twine",
    "yaxmldiff",
    "yamllint",
    "wheel",
]

[project.scripts]
gcovr = "gcovr.__main__:main"

[project.urls]
Documentation = "https://gcovr.com"
Github = "https://github.com/gcovr/gcovr"
Issues = "https://github.com/gcovr/gcovr/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gcovr"]

[tool.hatch.build.targets.sdist]
include = ["src/gcovr/"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/x-rst"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.rst"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\.\. image:: \./'
# The variable reference is replaced with the packaged version by fancy-pypi-readme
replacement = '.. image:: https://raw.githubusercontent.com/gcovr/gcovr/$HFPR_VERSION/'


[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

[tool.hatch.build.hooks.vcs]
version-file = "src/gcovr/version.py"
template = """\
# file generated by setuptools_scm
# don't change, don't track in version control
__version__ = {version!r}
"""

[tool.pylint]
ignore-paths = ["tests/*"]
fail-under = 9.98
disable = [
    "unknown-option-value",          # This is because we are testing with several versions
    "Format",
    "missing-module-docstring",
    "no-member",
    "too-few-public-methods",
    # Deactivate "too-many-..." for now
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-branches",
    "too-many-statements",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-instance-attributes",
    "too-many-public-methods",
    "R0801",                         # Similar lines
]
extension-pkg-allow-list = ["lxml", "gcovr"]

[tool.mypy]
install_types = true
non_interactive = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
disable_error_code = "attr-defined"
exclude = [
    "build/.*",
    "debug/.*",
]

[tool.pyright]
reportAttributeAccessIssue = false

[tool.ruff]
exclude = [
    "__pycache__",
    "tests/cmake-gtest/output/",
    "src/gcovr/version.py",
]

[tool.ruff.lint]
# Enable flake8-bugbear (`B`) rules, in addition to the defaults.
select = ["ALL"] #["E4", "E7", "E9", "F", "B", "I"]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed in `root`
    "C901",    # `...` is too complex
    "COM812",  # The following rule may cause conflicts when used with the formatter: `missing-trailing-comma` (`COM812`).
    "D203",    # `incorrect-blank-line-before-class` (D203) and `blank-line-before-class` (D211) are incompatible. Ignoring `incorrect-blank-line-before-class`.
    "D212",    # `multi-line-summary-first-line` (D212) and `multi-line-summary-second-line` (D213) are incompatible. Ignoring `multi-line-summary-second-line`.
    "FIX002",  # Line contains TODO, consider resolving the issue
    "PTH",     # Do not use os.path
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments in function definition
    "PLR0915", # Too many statements
    "PLR0917", # Too many positional arguments
    "TD002",   # missing-todo-author
    "TD003",   # missing-todo-link
    "TID252",  # Prefer absolute imports over relative imports from parent modules
    "TRY301",  # Abstract `raise` to an inner function
    "UP035",   # deprecated-import
]
task-tags = [
    "cspell", # To not detect cspell comments as code
]

[tool.ruff.lint.pycodestyle]
max-line-length = 150

[tool.ruff.lint.per-file-ignores]
"src/gcovr/options.py" = [
    "A001",    # Variable `help` is shadowing a Python builtin
    "A002",    # Function argument `help` is shadowing a Python builtin
]
"tests/*" = [
    "INP001",  # File `...` is part of an implicit namespace package. Add an `__init__.py`.
    "D100",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D103",    # Missing docstring in public function
    "S101",    # Use of `assert` detected
]

[tool.ruff.lint.isort]
known-first-party = ["gcovr"]

[tool.bandit]
assert_used.skips = [
    "*/conftest.py",
    "*/test_*.py"
]

[tool.pytest.ini_options]
addopts = "-n auto -v --timeout=120 --doctest-modules --ignore-glob */output/* --ignore-glob */.nox*/*"
env = [
    "D:CC=gcc",
    "GCOVR_TEST_SUITE=1",
    "GCOVR_TEST_SUITE_NO_GIT_COMMAND=1",
    "SOURCE_DATE_EPOCH=1768334355",
]
markers = [
    "csv",
    "json",
    "html",
    "txt",
    "markdown",
    "clover",
    "cobertura",
    "coveralls",
    "jacoco",
    "lcov",
    "sonarqube",
]

[tool.coverage.run]
branch = true
relative_files = true
source = [
    "src"
]
omit = [
    "*/src/gcovr/version.py"
]
patch = [
    "subprocess"
]

[tool.coverage.report]
exclude_lines = [
    "[#]\\s*pragma: no cover",

    "^\\s*raise SanityCheckError\\b",
    "^\\s*raise AssertionError\\b",
    "^\\s*raise NotImplementedError\\b",
]

[tool.coverage.html]
directory = "htmlcov"
