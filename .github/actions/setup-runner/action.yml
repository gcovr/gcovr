---
# Schema: https://json.schemastore.org/github-action.json
name: Set up Runner
description: Set up the runner with required system and Python dependencies.

inputs:
  os:
    type: string
    description: "The operating system of the runner"
    required: true
  gcc:
    type: string
    description: "The GCC version to use"
    required: true
  python-version:
    type: string
    description: "The python version to use"
    required: true

runs:
  using: 'composite'
  steps:
    # ------------------------------ Ubuntu ------------------------------
    - if: ${{ startsWith(inputs.os,'ubuntu-') && (inputs.gcc != '')}}
      run: sudo apt update
      shell: bash
    - if: ${{ startsWith(inputs.os,'ubuntu-') && (inputs.gcc != '')}}
      run: sudo apt-get install -y make ninja-build ${INPUTS_GCC} $(echo ${INPUTS_GCC} | sed -e 's/gcc/g\+\+/') libxml2-utils
      shell: bash
      env:
        INPUTS_GCC: ${{ inputs.gcc }}

    # ------------------------------ Windows ------------------------------
    - if: ${{ startsWith(inputs.os,'windows-') }}
      uses: msys2/setup-msys2@cafece8e6baf9247cf9b1bf95097b0b983cc558d
      with:
        install: gcc make
        cache: true

    # ------------------------------ MacOs ------------------------------
    - if: ${{ startsWith(inputs.os,'macos-') }}
      run: brew analytics on
      shell: bash
    - if: ${{ startsWith(inputs.os,'macos-') }}
      run: HOMEBREW_NO_AUTO_UPDATE=1 brew update
      shell: bash
    - if: ${{ startsWith(inputs.os,'macos-') }}
      run: HOMEBREW_NO_AUTO_UPDATE=1 brew install libxml2
      shell: bash

    # ------------------------------ Python, all OS ------------------------------
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ inputs.python-version }}
    - name: Restore pip cache
      uses: re-actors/cache-python-deps@250500eea3c0986666ae8bbeba9b23f69ae6a7d3
      with:
        cache-key-for-dependency-files: ${{ hashFiles('noxfile.py', 'pyproject.toml', 'doc/requirements.txt') }}
    - run: python3 -m pip install --upgrade pip
      shell: bash
    - run: python3 -m pip install nox requests
      shell: bash
